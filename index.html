<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10172a">
<title>日語隨身譯 · 廣東話 ⇄ 日本語</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#172139;--line:#31405c;--text:#f1f5ff;--muted:#aebbd1;--blue:#75aaff;--green:#64d9bd}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0d1b35,#0b1120 55%);font:16px -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:var(--text);min-height:100dvh}.wrap{max-width:680px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 35px)}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:46px;height:46px;border-radius:15px;background:#264a8e;display:grid;place-items:center;font-size:24px}h1{font-size:24px;margin:0}small,.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:17px;margin:14px 0;box-shadow:0 12px 30px #0002}.langbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.lang{flex:1;font-weight:700;text-align:center;font-size:15px}.swap{width:44px;height:44px;flex:none}.label{font-size:13px;color:var(--muted);margin:0 0 9px}textarea{width:100%;min-height:125px;resize:vertical;background:#0d172b;color:var(--text);border:1px solid #3c4e70;border-radius:13px;padding:14px;font:17px/1.6 inherit;outline:none}textarea:focus{border-color:var(--blue)}button{border:0;border-radius:13px;background:#2b3d60;color:var(--text);font:600 15px inherit;padding:13px 15px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55}button.primary{background:#78aaff;color:#09142c}button.mic{background:#1e6f65;color:#fff}button.mic.recording{background:#b23e58}button.ghost{border:1px solid var(--line);background:transparent}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1}.result{white-space:pre-wrap;overflow-wrap:anywhere;min-height:62px;font-size:20px;line-height:1.6}.status{margin-top:12px;min-height:24px;color:#c5d4ec;font-size:14px;line-height:1.5}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 12px;border:1px solid #405171;background:#22304b;border-radius:20px;font-size:13px}.note{font-size:13px;line-height:1.6;color:var(--muted)}.subhead{display:flex;align-items:center;justify-content:space-between;gap:8px}footer{font-size:12px;line-height:1.7;color:var(--muted);margin-top:22px}#history{display:grid;gap:9px}.hist{background:#101b30;border:1px solid #33415b;border-radius:12px;padding:12px;text-align:left;white-space:pre-wrap;line-height:1.5;font-size:13px}.hide{display:none!important}
</style>
</head>
<body><main class="wrap">
<header><div class="logo">🇯🇵</div><div><h1>日語隨身譯</h1><small>廣東話／繁體中文 ⇄ 日本語</small></div></header>
<section class="card"><div class="langbar"><div class="lang" id="sourceName">廣東話／繁體中文</div><button class="swap" id="swap" aria-label="交換翻譯方向">⇄</button><div class="lang" id="targetName">日本語</div></div></section>
<section class="card"><p class="label" id="inputLabel">輸入中文，或按咪高峰講廣東話</p><textarea id="input" placeholder="例如：請問最近的車站在哪裏？" aria-label="輸入要翻譯的文字"></textarea><div class="actions"><button class="mic" id="mic">🎙️ 開始講話</button><button class="ghost" id="clear">清除</button></div><div class="actions"><button class="primary" id="translate">翻譯 →</button></div><div class="status" id="status" role="status" aria-live="polite">準備就緒。語音輸入需要 Safari 支援及咪高峰權限。</div></section>
<section class="card"><div class="subhead"><p class="label" id="resultLabel">日文翻譯</p><button class="ghost" id="copy" style="padding:8px 11px">複製</button></div><div class="result" id="result">翻譯結果會顯示在這裏。</div><div class="actions"><button id="speak">🔊 朗讀翻譯</button><button class="ghost" id="stop">停止朗讀</button></div></section>
<section class="card"><p class="label">常用旅遊短句（點擊即翻譯）</p><div class="chips" id="phrases"></div></section>
<section class="card"><div class="subhead"><p class="label">最近翻譯（僅儲存於此瀏覽器）</p><button class="ghost" id="clearHistory" style="padding:8px 11px">清空</button></div><div id="history"><span class="note">尚未有翻譯紀錄。</span></div></section>
<footer>翻譯使用 MyMemory 公開翻譯介面，需要網絡，可能有每日使用限制、翻譯錯誤或服務暫時無法使用。輸入文字會傳送給第三方翻譯服務，請勿輸入密碼、護照號碼或敏感資料。廣東話語音辨識及日語朗讀聲線取決於 iOS／Safari 支援；如果咪高峰無法使用，可直接打字。翻譯結果不適合直接用於醫療、法律或緊急情況。</footer>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);let direction='zh-ja',recognition=null,listening=false,lastResult='',history=[];
try{history=JSON.parse(localStorage.getItem('jp-translator-history')||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}
const phrases=[['請問車站在哪裏？','駅はどこですか？'],['這個多少錢？','これはいくらですか？'],['我想要這個。','これをください。'],['請問有英文餐牌嗎？','英語のメニューはありますか？'],['不好意思，請再說一次。','すみません、もう一度お願いします。'],['謝謝！','ありがとうございます。']];
const isZh=()=>direction==='zh-ja';function status(t){$('status').textContent=t}function save(){try{localStorage.setItem('jp-translator-history',JSON.stringify(history))}catch(e){}}function renderHistory(){$('history').replaceChildren();if(!history.length){let s=document.createElement('span');s.className='note';s.textContent='尚未有翻譯紀錄。';$('history').append(s);return}history.forEach(item=>{let b=document.createElement('button');b.className='hist';b.textContent=(item.dir==='zh-ja'?'中文 → 日文':'日文 → 中文')+'\n'+item.from+'\n→ '+item.to;b.onclick=()=>{direction=item.dir;renderDirection();$('input').value=item.from;lastResult=item.to;$('result').textContent=item.to;status('已載入翻譯紀錄。')};$('history').append(b)})}
function renderDirection(){stopRecognition();$('sourceName').textContent=isZh()?'廣東話／繁體中文':'日本語';$('targetName').textContent=isZh()?'日本語':'繁體中文';$('inputLabel').textContent=isZh()?'輸入中文，或按咪高峰講廣東話':'輸入日文，或按咪高峰講日語';$('resultLabel').textContent=isZh()?'日文翻譯':'繁體中文翻譯';$('input').placeholder=isZh()?'例如：請問最近的車站在哪裏？':'例：駅はどこですか？';$('input').value='';lastResult='';$('result').textContent='翻譯結果會顯示在這裏。';renderPhrases();status('已切換翻譯方向。')}
function renderPhrases(){$('phrases').replaceChildren();phrases.forEach(p=>{let b=document.createElement('button');b.className='chip';b.textContent=p[isZh()?0:1];b.onclick=()=>{$('input').value=p[isZh()?0:1];translate()};$('phrases').append(b)})}
function toTraditional(s){return s.replace(/车站/g,'車站').replace(/车/g,'車').replace(/请/g,'請').replace(/问/g,'問').replace(/这/g,'這').replace(/个/g,'個').replace(/钱/g,'錢').replace(/谢/g,'謝').replace(/吗/g,'嗎').replace(/么/g,'麼').replace(/里/g,'裏').replace(/会/g,'會').replace(/说/g,'說').replace(/对/g,'對').replace(/门/g,'門').replace(/国/g,'國')}
async function translate(){let q=$('input').value.trim();if(!q){status('請先輸入文字，或使用咪高峰。');return}if(q.length>450){status('每次請輸入不多於 450 個字。');return}const btn=$('translate');btn.disabled=true;btn.textContent='翻譯中…';status('正在連線翻譯服務…');try{let pair=isZh()?'zh-TW|ja':'ja|zh-TW';let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+encodeURIComponent(pair);let controller=new AbortController();let timeout=setTimeout(()=>controller.abort(),12000);let res;try{res=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json'}})}finally{clearTimeout(timeout)}if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();if(data.responseStatus&&Number(data.responseStatus)>=400)throw Error(data.responseDetails||'服務暫時無法使用');let output=data.responseData&&data.responseData.translatedText;if(!output||typeof output!=='string')throw Error('未收到有效翻譯');let decoded=document.createElement('textarea');decoded.innerHTML=output;output=decoded.value;if(!isZh())output=toTraditional(output);lastResult=output;$('result').textContent=output;history.unshift({dir:direction,from:q,to:output});history=history.slice(0,12);save();renderHistory();status('翻譯完成。請留意機器翻譯可能不準確。')}catch(e){status('翻譯失敗：'+(e.name==='AbortError'?'連線逾時':e.message)+'。請檢查網絡或稍後再試。')}finally{btn.disabled=false;btn.textContent='翻譯 →'}}
function stopRecognition(){if(recognition){try{recognition.abort()}catch(e){}recognition=null}listening=false;$('mic').classList.remove('recording');$('mic').textContent='🎙️ 開始講話'}
function toggleMic(){if(listening){stopRecognition();status('已停止收音。');return}let SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SpeechRecognition){status('這個 Safari 版本沒有提供網頁語音辨識。請用鍵盤輸入，或使用 iPhone 鍵盤的聽寫咪高峰。');return}try{let rec=new SpeechRecognition();recognition=rec;rec.lang=isZh()?'yue-Hant-HK':'ja-JP';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=1;rec.onresult=e=>{let t=e.results[0][0].transcript;$('input').value=t;status('已辨識語音，正在翻譯…');translate()};rec.onerror=e=>{status('語音輸入未成功（'+e.error+'）。可改用鍵盤聽寫或打字。')};rec.onend=()=>{if(recognition===rec){recognition=null;listening=false;$('mic').classList.remove('recording');$('mic').textContent='🎙️ 開始講話'}};rec.start();listening=true;$('mic').classList.add('recording');$('mic').textContent='⏹ 停止收音';status('正在聆聽…請清楚講話。若廣東話辨識不支援，請改用 iPhone 鍵盤聽寫。')}catch(e){stopRecognition();status('無法啟動語音輸入。請確認 Safari 咪高峰權限，或改用鍵盤聽寫。')}}
function speak(){if(!lastResult){status('請先完成翻譯。');return}if(!('speechSynthesis'in window)){status('此瀏覽器不支援朗讀。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lastResult);u.lang=isZh()?'ja-JP':'zh-HK';u.rate=.88;u.onstart=()=>status('正在朗讀…');u.onend=()=>status('朗讀完成。');u.onerror=()=>status('朗讀失敗，請檢查 iPhone 聲音設定。');speechSynthesis.speak(u)}
$('swap').onclick=()=>{direction=isZh()?'ja-zh':'zh-ja';renderDirection()};$('translate').onclick=translate;$('mic').onclick=toggleMic;$('speak').onclick=speak;$('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();status('已停止朗讀。')};$('clear').onclick=()=>{$('input').value='';lastResult='';$('result').textContent='翻譯結果會顯示在這裏。';status('已清除輸入。')};$('copy').onclick=async()=>{if(!lastResult){status('沒有可複製的翻譯。');return}try{await navigator.clipboard.writeText(lastResult);status('已複製翻譯文字。')}catch(e){status('無法自動複製，請長按翻譯文字手動複製。')}};$('clearHistory').onclick=()=>{history=[];save();renderHistory();status('已清空紀錄。')};renderPhrases();renderHistory();
})();
</script></body></html>
